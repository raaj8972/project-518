[build]
  command = "npm run build"
  publish = "dist"

# Enable Netlify's built-in prerendering for better SEO
# This crawls your SPA and generates static HTML for all routes
[images]
  remote_images = ["https://pub-58ff2c8f3319429d8feb2eadb1b3713d.r2.dev/*"]

[[plugins]]
  package = "@netlify/plugin-sitemap"
  
[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID,VITE_FIREBASE_DATABASE_URL,VITE_MASTER_BYPASS_KEY"




[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@tensorflow/tfjs-node", "canvas", "@tensorflow/tfjs-backend-wasm"]

[functions.index-faces-batch]
  timeout = 26

# Environment variables (set these in Netlify dashboard)
# SUPABASE_URL - Your Supabase project URL
# SUPABASE_SERVICE_ROLE_KEY - Your Supabase service role key (keep secret!)
# SUPABASE_ANON_KEY - Your Supabase anon/public key

# Domain Redirects - Enforce non-www (canonical)
[[redirects]]
  from = "https://www.ricorrenza.fun/*"
  to = "https://ricorrenza.fun/:splat"
  status = 301
  force = true

# API Routes - Redirect to Netlify Functions (Node.js)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Redirects for SPA - fallback to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Global Assets - Allow CORS (helps with redirects for scripts)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://*.supabase.co https://apis.google.com https://*.firebaseapp.com https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://images.pexels.com https://*.r2.dev https://*.supabase.co https://lh3.googleusercontent.com https://*.googleusercontent.com https://api.qrserver.com https://raw.githack.com https://www.google.com https://www.gstatic.com; font-src 'self' https://fonts.gstatic.com; media-src 'self' blob: https://*.supabase.co; connect-src 'self' blob: data: https://*.supabase.co wss://*.supabase.co ws://localhost:* ws://127.0.0.1:* https://*.r2.dev https://api.resend.com https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://www.cloudflare.com https://api.ipify.org https://raw.githack.com https://cdn.jsdelivr.net https://*.firebase.com; frame-src 'self' https://*.supabase.co https://*.firebaseapp.com; worker-src 'self' blob:;"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/.netlify/functions/get-r2-upload-url"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Content-Type = "application/javascript"
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

# --- ONE-CLICK DEPLOY SETUP ---
# This configures the "Deploy to Netlify" button to ask for these variables automatically.
[template.environment]
  VITE_SUPABASE_URL = "Your Supabase Project URL"
  VITE_SUPABASE_ANON_KEY = "Your Supabase Anonymous Key"
  SUPABASE_SERVICE_ROLE_KEY = "Your Supabase Service Role Key (Keep Secret!)"
  GOOGLE_API_KEY = "Your Google Gemini API Key"
  
  # Optional / Advanced Defaults can be pre-filled
  VITE_FETCH_MAX_RETRIES = "3"
  VITE_FETCH_TIMEOUT_MS = "15000"
  
  # Storage
  R2_ACCOUNT_ID = "Cloudflare R2 Account ID"
  R2_ACCESS_KEY_ID = "R2 Access Key ID"
  R2_SECRET_ACCESS_KEY = "R2 Secret Access Key"
  R2_BUCKET_NAME = "R2 Bucket Name"
  R2_PUBLIC_DOMAIN = "R2 Public URL (e.g. pub-xxx.r2.dev)"
  
  # Email
  RESEND_API_KEY = "Resend API Key (Optional)"
  SMTP_HOST = "smtp.gmail.com"
  SMTP_PORT = "465"
  SMTP_SECURE = "true"
  SMTP_USER = "Email sender address"
  SMTP_PASS = "Email password or App Password"
  
  # Auth
  MASTER_BYPASS_KEY = "Admin Master Password"


