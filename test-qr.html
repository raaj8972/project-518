<!DOCTYPE html>
<html>
<head>
    <title>Test QR Code</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #1a1a2e;
            color: white;
            font-family: Arial, sans-serif;
        }
        #qr {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px;
        }
    </style>
</head>
<body>
    <h1>Test QR Code</h1>
    <p>Scan this with your security scanner</p>
    <div id="qr"></div>
    <p>Token: TEST-123456789ABC</p>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        new QRCode(document.getElementById("qr"), {
            text: "TEST-123456789ABC",
            width: 256,
            height: 256
        });
    </script>
</body>
</html>
