    <script>
      // Shim process.env for third-party scripts that expect it
      window.global = window;
      var _process = {
        env: { NODE_ENV: 'production' },
        version: 'v16.0.0',
        nextTick: function(fn) { setTimeout(fn, 0); },
        browser: true
      };
      window.process = window.process || _process;
      window.process.env = window.process.env || _process.env;
      window.process.version = window.process.version || _process.version;
      window.process.nextTick = window.process.nextTick || _process.nextTick;

      // Minimal Buffer shim to prevent readable-stream from crashing during module evaluation
      if (typeof window.Buffer === 'undefined') {
        window.Buffer = {
          isBuffer: function() { return false; },
          from: function() { return new Uint8Array(); },
          alloc: function() { return new Uint8Array(); },
          prototype: {}
        };
      }

      // Emergency Service Worker Reset + CDN Cache Bust for the Framer Motion v12 Regression
      // Only run once per session to avoid infinite reload loops
      var _emergencyRan = sessionStorage.getItem('_emergency_ran');

      function _emergencyReset() {
        if (_emergencyRan) return;
        _emergencyRan = true;
        sessionStorage.setItem('_emergency_ran', '1');
        console.error('[Emergency] Detected stale vendor bundle. Clearing caches and forcing hard reload...');
        // Unregister all service workers
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r) { r.unregister(); });
          });
        }
        // Clear all caches
        if (window.caches) {
          caches.keys().then(function(names) {
            names.forEach(function(n) { caches.delete(n); });
          });
        }
        // Redirect with a cache-busting query param to force fresh index.html from CDN
        setTimeout(function() {
          window.location.replace('/?_v=' + Date.now());
        }, 300);
      }

      // Detect the createContext error from a stale vendor bundle
      window.addEventListener('error', function(e) {
        if (e.message && e.message.includes('createContext') && e.filename && e.filename.includes('vendor')) {
          _emergencyReset();
        }
      });

      // Also listen for CACHE_CLEARED message from Service Worker
      // (triggered by the "RELOAD & FIX SITE" button or CLEAR_CACHE message)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('message', function(event) {
          if (event.data && event.data.type === 'CACHE_CLEARED') {
            console.log('[Emergency] SW cache cleared, redirecting with cache-bust...');
            // Use cache-busting redirect instead of plain reload
            window.location.replace('/?_v=' + Date.now());
          }
        });
      }

      // On successful load, clear the session flag
      window.addEventListener('load', function() {
        var root = document.getElementById('root');
        if (root && root.children.length > 1) {
          sessionStorage.removeItem('_emergency_ran');
        }
      });
    </script>

    <!-- Emergency Recovery Script (Detects half-load/hangs) -->
    <script>
      (function() {
        const timeout = 15000; // 15 seconds
        const check = () => {
          const skeleton = document.getElementById('app-skeleton');
          
          // If skeleton is still visible and app hasn't flagged itself as ready
          if (skeleton && !window.__APP_READY__) {
            console.warn('[Recovery] App mount hang detected after ' + (timeout/1000) + 's');
            
            // Inject emergency recovery button
            const btn = document.createElement('button');
            btn.id = 'emergency-recovery-btn';
            btn.innerHTML = 'RELOAD & FIX SITE';
            btn.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:999999;background:#00ffff;color:#000;border:none;padding:12px 24px;border-radius:4px;font-family:Orbitron,sans-serif;font-weight:900;cursor:pointer;box-shadow:0 0 20px #00ffff;letter-spacing:1px;';
            btn.onclick = () => {
              btn.innerHTML = 'FIXING...';
              if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
                navigator.serviceWorker.controller.postMessage({ type: 'CLEAR_CACHE' });
                setTimeout(() => window.location.reload(true), 1500);
              } else {
                window.location.reload(true);
              }
            };
            if (!document.getElementById('emergency-recovery-btn')) {
              document.body.appendChild(btn);
            }
          }
        };
        setTimeout(check, timeout);

        // Auto-recovery: If network returns and we are STILL stuck, auto-reload once
        window.addEventListener('online', () => {
          const skeleton = document.getElementById('app-skeleton');
          if (skeleton && !window.__APP_READY__) {
            console.log('[Recovery] Network returned, attempting auto-recovery...');
            window.location.reload();
          }
        });
      })();
    </script>
