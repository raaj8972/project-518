<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>RICORRENZA </title>
    <meta name="description" content="Experience the future at RICORRENZA 2025 - The official cultural festival of IQ City Medical college,Durgapur." />
    
    <!-- Cyberpunk Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Global Cyberpunk Styles -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html {
        scroll-behavior: smooth;
      }
      
      body {
        font-family: 'Rajdhani', 'Orbitron', sans-serif;
        background: #0a0a0a;
        color: #ffffff;
        overflow-x: hidden;
      }
      /* Particles cursor global layer */
      .particles-cursor-layer {
        position: fixed;
        inset: 0;
        z-index: 9999; /* keep above site chrome but non-interactive */
        pointer-events: none;
        background: radial-gradient(ellipse at center, rgba(0,0,0,0.12) 0%, rgba(0,0,0,0.0) 60%);
      }
      .particles-cursor-layer canvas {
        display: block;
        position: fixed !important;
        inset: 0;
        pointer-events: none !important;
        z-index: 9999 !important;
        mix-blend-mode: screen; /* bright on dark/light */
      }
      
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      
      ::-webkit-scrollbar-track {
        background: #1a1a2e;
      }
      
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(45deg, #ff00ff, #00ffff);
        border-radius: 2px;
      }
      
      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(45deg, #00ffff, #ff00ff);
      }
      
      /* Loading animation */
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }
      
      .loading-content {
        text-align: center;
      }
      
      .loading-logo {
        font-size: 3rem;
        font-weight: 900;
        font-family: 'Orbitron', sans-serif;
        background: linear-gradient(45deg, #ff00ff, #00ffff, #ff00ff);
        background-size: 200% 200%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: gradientShift 2s ease-in-out infinite;
        margin-bottom: 2rem;
      }
      
      .loading-bar {
        width: 200px;
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        overflow: hidden;
        margin: 0 auto;
      }
      
      .loading-progress {
        height: 100%;
        background: linear-gradient(90deg, #ff00ff, #00ffff);
        border-radius: 2px;
        animation: loadingProgress 2s ease-in-out;
      }
      
      @keyframes gradientShift {
        0%, 100% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
      }
      
      @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
      }
      
      /* Page transition effects */
      .page-transition {
        animation: pageSlideIn 0.5s ease-out;
      }
      
      @keyframes pageSlideIn {
        from {
          opacity: 0;
          transform: translateX(20px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      
      /* Global cyberpunk utilities */
      .cyberpunk-glow {
        box-shadow: 0 0 20px rgba(255, 0, 255, 0.3);
      }
      
      .cyberpunk-glow:hover {
        box-shadow: 0 0 30px rgba(255, 0, 255, 0.6);
      }
      
      .neon-border {
        border: 1px solid rgba(0, 255, 255, 0.5);
        box-shadow: 
          0 0 10px rgba(0, 255, 255, 0.3),
          inset 0 0 10px rgba(0, 255, 255, 0.1);
      }
      
      /* Responsive design */
      @media (max-width: 768px) {
        .loading-logo {
          font-size: 1.8rem;
        }
        
        .loading-bar {
          width: 120px;
        }
      }
      
      @media (max-width: 480px) {
        .loading-logo {
          font-size: 1.5rem;
        }
        
        .loading-bar {
          width: 100px;
        }
        
        .loading-content {
          padding: 0 1rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
      <div class="loading-content">
        <div class="loading-logo">RICORRENZA</div>
        <div class="loading-bar">
          <div class="loading-progress"></div>
        </div>
      </div>
    </div>
    
  <div id="root" style="position: relative; z-index: 1;"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Loading Screen Script -->
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loadingScreen = document.getElementById('loading-screen');
          if (loadingScreen) {
            loadingScreen.style.opacity = '0';
            setTimeout(function() {
              loadingScreen.style.display = 'none';
            }, 500);
          }
        }, 2000);
      });
    </script>
  </body>
</html>
