<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Siren Light Animations -->
    <animate id="redBlink" attributeName="opacity" values="1;0.2;1" dur="0.6s" repeatCount="indefinite"/>
    <animate id="blueBlink" attributeName="opacity" values="0.2;1;0.2" dur="0.6s" repeatCount="indefinite"/>
    
    <!-- Gradients for 3D effect -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f0f0f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d0d0d0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87ceeb;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#4682b4;stop-opacity:0.8" />
    </linearGradient>
    
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff0000;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc0000;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0000ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4444ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0000cc;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="4" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Glow filter for siren lights -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <g transform="translate(100, 100)" filter="url(#shadow)">
    <!-- Bottom shadow -->
    <ellipse cx="0" cy="55" rx="50" ry="8" fill="#000000" opacity="0.2"/>
    
    <!-- Wheels -->
    <!-- Front wheel -->
    <circle cx="28" cy="35" r="12" fill="#222222" stroke="#111111" stroke-width="2"/>
    <circle cx="28" cy="35" r="6" fill="#444444"/>
    <!-- Back wheel -->
    <circle cx="-28" cy="35" r="12" fill="#222222" stroke="#111111" stroke-width="2"/>
    <circle cx="-28" cy="35" r="6" fill="#444444"/>
    
    <!-- Main body (white) -->
    <!-- Bottom section -->
    <rect x="-45" y="-5" width="90" height="40" rx="4" fill="url(#bodyGrad)" stroke="#b0b0b0" stroke-width="1.5"/>
    
    <!-- Top cabin section (3D effect) -->
    <path d="M -40,-5 L -40,-35 L -15,-45 L 40,-45 L 40,-5 Z" fill="url(#bodyGrad)" stroke="#b0b0b0" stroke-width="1.5"/>
    
    <!-- Front windshield -->
    <path d="M 38,-43 L 38,-7 L 30,-7 L 30,-38 Z" fill="url(#windowGrad)" stroke="#6495ed" stroke-width="1"/>
    
    <!-- Side windows -->
    <rect x="-35" y="-40" width="28" height="22" rx="2" fill="url(#windowGrad)" stroke="#6495ed" stroke-width="1"/>
    <rect x="5" y="-40" width="28" height="22" rx="2" fill="url(#windowGrad)" stroke="#6495ed" stroke-width="1"/>
    
    <!-- Red Cross Symbol on side -->
    <g transform="translate(18, 3)">
      <rect x="-2" y="-8" width="4" height="16" fill="#ff0000" rx="1"/>
      <rect x="-8" y="-2" width="16" height="4" fill="#ff0000" rx="1"/>
    </g>
    
    <!-- Bumper highlights -->
    <rect x="40" y="10" width="5" height="8" rx="1" fill="#ffd700"/>
    <rect x="40" y="22" width="5" height="8" rx="1" fill="#ff4444"/>
    
    <!-- Door line -->
    <line x1="0" y1="-5" x2="0" y2="35" stroke="#b0b0b0" stroke-width="1.5"/>
    
    <!-- Roof siren lights with animation -->
    <g transform="translate(0, -50)">
      <!-- Siren housing -->
      <rect x="-20" y="0" width="40" height="8" rx="4" fill="#333333" stroke="#222222" stroke-width="1"/>
      
      <!-- Red light (left) -->
      <g filter="url(#glow)">
        <ellipse cx="-10" cy="4" rx="6" ry="3" fill="url(#redGrad)">
          <animate attributeName="opacity" values="1;0.3;1" dur="0.6s" repeatCount="indefinite"/>
        </ellipse>
        <!-- Light beam effect -->
        <path d="M -10,7 L -15,15 L -5,15 Z" fill="#ff0000" opacity="0.4">
          <animate attributeName="opacity" values="0.6;0.1;0.6" dur="0.6s" repeatCount="indefinite"/>
        </path>
      </g>
      
      <!-- Blue light (right) -->
      <g filter="url(#glow)">
        <ellipse cx="10" cy="4" rx="6" ry="3" fill="url(#blueGrad)">
          <animate attributeName="opacity" values="0.3;1;0.3" dur="0.6s" repeatCount="indefinite"/>
        </ellipse>
        <!-- Light beam effect -->
        <path d="M 10,7 L 5,15 L 15,15 Z" fill="#0000ff" opacity="0.4">
          <animate attributeName="opacity" values="0.1;0.6;0.1" dur="0.6s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>
    
    <!-- "AMBULANCE" text on front -->
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#ff0000" text-anchor="middle" transform="rotate(90, 20, 30)">AMBULANCE</text>
    
    <!-- 3D depth lines -->
    <line x1="-40" y1="-35" x2="-45" y2="-30" stroke="#999999" stroke-width="1" opacity="0.5"/>
    <line x1="-15" y1="-45" x2="-20" y2="-40" stroke="#999999" stroke-width="1" opacity="0.5"/>
  </g>
</svg>
