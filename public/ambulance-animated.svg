<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for body -->
    <linearGradient id="bodyWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8e8e8;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="bodyRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff3333;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc0000;stop-opacity:1" />
    </linearGradient>
    
    <!-- Window gradient -->
    <linearGradient id="windowBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4dd0e1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00acc1;stop-opacity:1" />
    </linearGradient>
    
    <!-- Siren light gradients -->
    <radialGradient id="redSiren">
      <stop offset="0%" style="stop-color:#ff0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#990000;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="blueSiren">
      <stop offset="0%" style="stop-color:#0066ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003399;stop-opacity:1" />
    </radialGradient>
    
    <!-- ENHANCED Glow filters for sirens -->
    <filter id="redGlow" x="-200%" y="-200%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="blueGlow" x="-200%" y="-200%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Shadow filter -->
    <filter id="dropShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <g transform="translate(150, 100)" filter="url(#dropShadow)">
    <!-- Ground shadow -->
    <ellipse cx="0" cy="75" rx="100" ry="12" fill="#000000" opacity="0.2"/>
    
    <!-- === WHEELS === -->
    <!-- Back wheel -->
    <g id="backWheel" transform="translate(-55, 55)">
      <circle cx="0" cy="0" r="20" fill="#1a1a1a" stroke="#000000" stroke-width="2"/>
      <circle cx="0" cy="0" r="15" fill="#333333"/>
      <circle cx="0" cy="0" r="8" fill="#555555"/>
      <!-- Wheel spokes (rotating) -->
      <g>
        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0 0 0"
          to="360 0 0"
          dur="5s"
          repeatCount="indefinite"/>
        <line x1="0" y1="-12" x2="0" y2="12" stroke="#777777" stroke-width="2"/>
        <line x1="-12" y1="0" x2="12" y2="0" stroke="#777777" stroke-width="2"/>
        <line x1="-8" y1="-8" x2="8" y2="8" stroke="#777777" stroke-width="2"/>
        <line x1="-8" y1="8" x2="8" y2="-8" stroke="#777777" stroke-width="2"/>
      </g>
    </g>
    
    <!-- Front wheel -->
    <g id="frontWheel" transform="translate(70, 55)">
      <circle cx="0" cy="0" r="20" fill="#1a1a1a" stroke="#000000" stroke-width="2"/>
      <circle cx="0" cy="0" r="15" fill="#333333"/>
      <circle cx="0" cy="0" r="8" fill="#555555"/>
      <!-- Wheel spokes (rotating) -->
      <g>
        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0 0 0"
          to="360 0 0"
          dur="5s"
          repeatCount="indefinite"/>
        <line x1="0" y1="-12" x2="0" y2="12" stroke="#777777" stroke-width="2"/>
        <line x1="-12" y1="0" x2="12" y2="0" stroke="#777777" stroke-width="2"/>
        <line x1="-8" y1="-8" x2="8" y2="8" stroke="#777777" stroke-width="2"/>
        <line x1="-8" y1="8" x2="8" y2="-8" stroke="#777777" stroke-width="2"/>
      </g>
    </g>
    
    <!-- === MAIN BODY === -->
    <!-- Bottom white section -->
    <rect x="-80" y="10" width="160" height="45" rx="3" fill="url(#bodyWhite)" stroke="#cccccc" stroke-width="1.5"/>
    
    <!-- Red stripe -->
    <rect x="-80" y="20" width="160" height="20" fill="url(#bodyRed)"/>
    
    <!-- Back cabin (box section) -->
    <rect x="-80" y="-40" width="100" height="50" rx="3" fill="url(#bodyWhite)" stroke="#cccccc" stroke-width="1.5"/>
    
    <!-- Front cabin (driver section) -->
    <path d="M 20,-40 L 90,-15 L 90,10 L 20,10 Z" fill="url(#bodyWhite)" stroke="#cccccc" stroke-width="1.5"/>
    
    <!-- Windshield -->
    <path d="M 25,-35 L 80,-15 L 80,5 L 25,5 Z" fill="url(#windowBlue)" stroke="#00acc1" stroke-width="1.5" opacity="0.9"/>
    
    <!-- Side windows on box -->
    <rect x="-70" y="-32" width="30" height="18" rx="2" fill="url(#windowBlue)" stroke="#00acc1" stroke-width="1"/>
    <rect x="-35" y="-32" width="30" height="18" rx="2" fill="url(#windowBlue)" stroke="#00acc1" stroke-width="1"/>
    
    <!-- Door line -->
    <line x1="-5" y1="-40" x2="-5" y2="55" stroke="#cccccc" stroke-width="2"/>
    
    <!-- Medical cross -->
    <g transform="translate(-50, 30)">
      <rect x="-3" y="-10" width="6" height="20" fill="#ff0000" rx="1"/>
      <rect x="-10" y="-3" width="20" height="6" fill="#ff0000" rx="1"/>
    </g>
    
    <!-- AMBULANCE text -->
    <text x="30" y="35" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#00acc1" text-anchor="middle">AMBULANCE</text>
    
    <!-- Medical star symbol -->
    <g transform="translate(65, 30)">
      <path d="M 0,-6 L 2,-2 L 6,-2 L 3,1 L 4,5 L 0,3 L -4,5 L -3,1 L -6,-2 L -2,-2 Z" fill="#00acc1"/>
    </g>
    
    <!-- Front lights -->
    <rect x="88" y="0" width="4" height="5" rx="1" fill="#ffeb3b"/>
    <rect x="88" y="7" width="4" height="5" rx="1" fill="#ff3333"/>
    
    <!-- === ROOF SIRENS WITH INTENSE GLOW === -->
    <g transform="translate(0, -50)">
      <!-- Siren bar -->
      <rect x="-35" y="0" width="70" height="10" rx="5" fill="#333333" stroke="#1a1a1a" stroke-width="1"/>
      
      <!-- Red siren (left) with INTENSE glow -->
      <g filter="url(#redGlow)">
        <!-- Large glow halo -->
        <ellipse cx="-15" cy="5" rx="25" ry="15" fill="#ff0000" opacity="0.4">
          <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/>
        </ellipse>
        <rect x="-25" y="2" width="20" height="6" rx="3" fill="url(#redSiren)">
          <animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/>
        </rect>
        <!-- Inner bright glow -->
        <ellipse cx="-15" cy="5" rx="18" ry="10" fill="#ff3333" opacity="0.5">
          <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/>
        </ellipse>
      </g>
      
      <!-- White siren (middle) -->
      <rect x="-10" y="2" width="20" height="6" rx="3" fill="#ffffff"/>
      
      <!-- Blue siren (right) with INTENSE glow -->
      <g filter="url(#blueGlow)">
        <!-- Large glow halo -->
        <ellipse cx="15" cy="5" rx="25" ry="15" fill="#0066ff" opacity="0.4">
          <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3s" repeatCount="indefinite"/>
        </ellipse>
        <rect x="5" y="2" width="20" height="6" rx="3" fill="url(#blueSiren)">
          <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
        </rect>
        <!-- Inner bright glow -->
        <ellipse cx="15" cy="5" rx="18" ry="10" fill="#4444ff" opacity="0.5">
          <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/>
        </ellipse>
      </g>
    </g>
    
    <!-- Side details -->
    <rect x="-75" y="45" width="15" height="5" rx="1" fill="#333333"/>
    <rect x="60" y="45" width="15" height="5" rx="1" fill="#333333"/>
    
    <!-- Rear doors detail -->
    <line x1="-80" y1="-15" x2="-80" y2="10" stroke="#999999" stroke-width="1.5"/>
  </g>
</svg>
