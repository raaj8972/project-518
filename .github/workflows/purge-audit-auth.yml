name: Purge auth.audit_log_entries (older than 48h)

# Run hourly and allow manual dispatch
on:
  schedule:
    - cron: '5 * * * *'   # hourly at minute 5 (gives a small slack window)
  workflow_dispatch:

jobs:
  purge-auth-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Purge auth.audit_log_entries older than 48 hours
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "Missing required secrets SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          fi

          # compute timestamp for 48 hours ago in RFC3339 (UTC)
          # On ubuntu runner date supports -d
          TIMESTAMP_48HAGO=$(date -u -d '48 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "Deleting rows with created_at < ${TIMESTAMP_48HAGO} from auth.audit_log_entries"

          # Perform DELETE via PostgREST. Use Accept-Profile / Content-Profile to target the 'auth' schema.
          # Prefer: return=representation makes PostgREST return the deleted rows as JSON so we can count them.
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X DELETE \
            "${SUPABASE_URL}/rest/v1/audit_log_entries?created_at=lt.${TIMESTAMP_48HAGO}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -H "Prefer: return=representation" \
            -H "Accept-Profile: auth" \
            -H "Content-Profile: auth" )

          # Separate body and status
          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)

          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "204" ]; then
            echo "Request failed (HTTP $HTTP_STATUS). Response body:"
            echo "$HTTP_BODY"
            exit 1
          fi

          # If we got JSON back (200 with representation), count elements; if empty/no content (204), set 0.
          if [ -z "$(echo "$HTTP_BODY" | tr -d '[:space:]')" ]; then
            DELETED_COUNT=0
          else
            DELETED_COUNT=$(python3 - <<PY
import sys, json
try:
    data = json.load(sys.stdin)
    print(len(data) if isinstance(data, list) else 1)
except Exception:
    print(0)
PY
            <<JSON
$HTTP_BODY
JSON
)
          fi

          echo "Deleted rows (older than 48h): ${DELETED_COUNT}"
