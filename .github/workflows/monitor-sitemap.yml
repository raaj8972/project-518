name: Monitor sitemap and site health

on:
  schedule:
    - cron: '0 * * * *' # hourly
  push:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Run sitemap monitor
        run: |
          chmod +x scripts/monitor_sitemap.sh
          ./scripts/monitor_sitemap.sh
